name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'  # Push events to matching v*, i.e. v1.0, v2.0.1
  workflow_dispatch: # Allow manual trigger

jobs:
  build-n-publish:
    name: Build and publish Python 🐍 distributions 📦 to PyPI
    runs-on: ubuntu-latest

    permissions:
      # This permission is required for trusted publishing (OIDC).
      id-token: write
      contents: read

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build

    - name: Build a binary wheel and a source tarball
      run: python -m build

    - name: Publish package distributions 📦 to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      # Note: No username/password/token needed if Trusted Publishing is set up on PyPI.
      # If not using Trusted Publishing, you would need:
      # with:
      #   password: ${{ secrets.PYPI_API_TOKEN }}
