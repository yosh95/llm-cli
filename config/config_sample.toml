[google]
api_key = "<Your API Key>"
cse_id = "<Your CSE ID>"
system_prompt = "For mathematical expressions, use Unicode instead of TeX whenever possible, except when instructed to write TeX code. Use Unicode for superscript and subscript characters as well."

[google.models]
default = "gemini-3-flash-preview"
lite = "gemini-2.5-flash-lite"
flash = "gemini-3-flash-preview"
pro = "gemini-3-pro-preview"
image = "gemini-3-pro-image-preview"

[openai]
api_key = "<Your API Key>"
system_prompt = "For mathematical expressions, use Unicode instead of TeX whenever possible, except when instructed to write TeX code."

[openai.models]
default = "gpt-5.2"

[openai.tools]
image = '{"type": "image_generation"}'

[anthropic]
api_key = "<Your API Key>"
system_prompt = "For mathematical expressions, use Unicode instead of TeX whenever possible, except when instructed to write TeX code."

[anthropic.models]
default = "claude-opus-4-5-20251101"
haiku = "claude-haiku-4-5-20251001"
sonnet = "claude-sonnet-4-5-20250929"
opus = "claude-opus-4-5-20251101"

[xai]
api_key = "<Your API Key>"
system_prompt = "For mathematical expressions, use Unicode instead of TeX whenever possible, except when instructed to write TeX code."

[xai.models]
default = "grok-4-1-fast-reasoning"

# MCP Server Configurations
# You can connect to remote llm-cli instances via SSH or other MCP servers.
[[mcp_servers]]
name = "remote_server"
command = "ssh"
args = ["user@your-remote-host", "python3", "-m", "llm_cli.apps.mcp_server"]

# Example of a local Node.js based MCP server
# [[mcp_servers]]
# name = "brave-search"
# command = "npx"
# args = ["-y", "@modelcontextprotocol/server-brave-search"]
# env = { BRAVE_API_KEY = "<YOUR_KEY>" }

[general]
LLM_PROMPT_HISTORY = "~/.local/state/llm_cli/history.txt"
LLM_CHAT_LOG = "~/.local/share/llm_cli/chat.log"
max_prompt_history_lines = 1000
max_chat_log_lines = 10000
unified_default_provider = "google"
