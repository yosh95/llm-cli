# =============================================================================
# General Settings
# =============================================================================
[general]
command_timeout = 300
max_command_memory_mb = 1024
max_output_length = 10000

# =============================================================================
# Security
# =============================================================================
[security]
# Default roles for local session tools. Note: Policy engine still evaluates these.
default_roles = ["admin"]
default_user_id = "current_user"

# Path-based access control (Whitelist/Blacklist)
# "." represents the current working directory.
allowed_paths = ["."]
allowed_env_vars = []

# Explicitly forbidden paths. Use absolute paths or "~" expansion.
# These will be blocked even if they are within an allowed path.
blocked_paths = [
    "/etc",
    "/var",
    "/root",
    "/bin",
    "/sbin",
    "/usr",
    "/dev",
    "/proc",
    "/sys",
    "/boot"
]

# =============================================================================
# Gemini (Google)
# =============================================================================
[google]

[google.models]
default = "gemini-3.1-pro-preview"
lite = "gemini-3.1-flash-lite-preview"
flash = "gemini-3-flash-preview"
pro = "gemini-3.1-pro-preview"
tools = "gemini-3.1-pro-preview-customtools"
image = "gemini-3.1-flash-image-preview"
image-flash = "gemini-3.1-flash-image-preview"
image-pro = "gemini-3-pro-image-preview"
tts = "gemini-2.5-pro-preview-tts"
video = "veo-3.1-generate-preview"

# =============================================================================
# OpenAI
# =============================================================================
[openai]

[openai.models]
default = "gpt-5.2"
nano = "gpt-5-nano"
mini = "gpt-5-mini"
chat = "gpt-5.2-chat-latest"
image = "chatgpt-image-latest"
video = "sora-2-pro"

# =============================================================================
# Anthropic (Claude)
# =============================================================================
[anthropic]
max_tokens = 8192

[anthropic.models]
default = "claude-opus-4-6"
haiku = "claude-haiku-4-5-20251001"
sonnet = "claude-sonnet-4-6"
opus = "claude-opus-4-6"

# =============================================================================
# xAI (Grok)
# =============================================================================
[xai]

[xai.models]
default = "grok-4-1-fast-reasoning"
non-reasoning = "grok-4-1-fast-non-reasoning"
reasoning = "grok-4-1-fast-reasoning"
image = "grok-imagine-image-pro"
video = "grok-imagine-video"

# =============================================================================
# Brave Search
# =============================================================================
[brave]

# =============================================================================
# Ollama (Local LLMs)
# =============================================================================
[ollama]
api_url = "http://localhost:11434/v1/chat/completions"

[ollama.models]
# No default model configs for Ollama

# =============================================================================
# vLLM
# =============================================================================
[vllm]
api_url = "http://localhost:8000/v1/chat/completions"

[vllm.models]
# No default model configs for vLLM

# =============================================================================
# Mamba (Local Distilled Model)
# =============================================================================
[mamba]
d_model = 256
n_layers = 8
online_lr = 1e-4

[mamba.models]
default = "mamba-local"
