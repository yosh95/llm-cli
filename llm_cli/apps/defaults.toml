# =============================================================================
# General Settings
# =============================================================================
[general]
unified_default_provider = "google"
request_timeout = 1800
command_timeout = 300
max_command_memory_mb = 1024
max_output_length = 30000
max_output_lines = 500
max_security_log_lines = 1000

# =============================================================================
# Security (Attribute-Based Access Control)
# =============================================================================
[security]
# API Keys MUST be set via environment variables.
# e.g., OPENAI_API_KEY, ANTHROPIC_API_KEY, GEMINI_API_KEY, XAI_API_KEY, OLLAMA_API_KEY
# For Brave Search, use BRAVE_SEARCH_API_KEY.

# Path-based access control (Resource Attributes)
allowed_paths = ["."]
allowed_env_vars = []

# Treat static analysis warnings for Python code as errors
static_analysis_is_error = true

# Explicitly forbidden paths. Use absolute paths or "~" expansion.
blocked_paths = [
    "/etc", "/var", "/root", "/bin", "/sbin", "/usr", "/dev", "/proc", "/sys", "/boot"
]

# Risk Level Classification
high_risk_tools = [
    "execute_python",
    "edit_file",
    "create_or_overwrite_file",
]
medium_risk_tools = [
    "read_file_content",
    "list_files_in_directory",
    "search_files",
    "search_web",
    "read_url_content"
]

# Security Posture (CASS)
# warn: log security violations but allow execution
# strict_block: block execution if security requirements (like PQC proof) are not met
pqc_enforcement = "warn"

# =============================================================================
# Google Gemini
# =============================================================================
[google]
[google.models]
default = "gemini-3-flash-preview"
lite = "gemini-3.1-flash-lite-preview"
flash = "gemini-3-flash-preview"
pro = "gemini-3.1-pro-preview"
image = "gemini-3.1-flash-image-preview"
image-pro = "gemini-3-pro-image-preview"

# =============================================================================
# OpenAI
# =============================================================================
[openai]
[openai.models]
default = "gpt-5.4-mini"
nano = "gpt-5.4-nano"
mini = "gpt-5.4-mini"
image = "chatgpt-image-latest"

# =============================================================================
# Anthropic (Claude)
# =============================================================================
[anthropic]
max_tokens = 8192
[anthropic.models]
default = "claude-sonnet-4-6"
haiku = "claude-haiku-4-5-20251001"
sonnet = "claude-sonnet-4-6"
opus = "claude-opus-4-6"

# =============================================================================
# xAI (Grok)
# =============================================================================
[xai]
[xai.models]
default = "grok-4-1-fast-reasoning"
non-reasoning = "grok-4-1-fast-non-reasoning"
reasoning = "grok-4-1-fast-reasoning"
image = "grok-imagine-image-pro"

# =============================================================================
# Brave Search
# =============================================================================
[brave]
# API key is set via BRAVE_SEARCH_API_KEY environment variable.

# =============================================================================
# Ollama (Local LLMs)
# =============================================================================
[ollama]
api_url = "http://localhost:11434/v1/chat/completions"
[ollama.models]
default = "llama3.2:3b"

# =============================================================================
# Reasoning Sentinel (Mamba-SSM Guard)
# =============================================================================
[sentinel]
enabled = true
mode = "learn"
checkpoint_path = "sentinel_state.npz"
