# =============================================================================
# General Settings
# =============================================================================
[general]
command_timeout = 300
max_command_memory_mb = 1024
max_output_length = 10000
max_security_log_lines = 1000

# =============================================================================
# Security
# =============================================================================
[security]
# Default roles for local session tools. Note: Policy engine still evaluates these.
default_roles = ["user"]
default_user_id = "current_user"

# Path-based access control (Whitelist/Blacklist)
# "." represents the current working directory.
allowed_paths = ["."]
allowed_env_vars = []

# Treat static analysis warnings as errors
static_analysis_is_error = true

# Default sandbox profile ("isolated" or "standard")
# "isolated" mounts the workspace as read-only.
sandbox_profile = "isolated"

# Explicitly forbidden paths. Use absolute paths or "~" expansion.
# These will be blocked even if they are within an allowed path.
blocked_paths = [
    "/etc",
    "/var",
    "/root",
    "/bin",
    "/sbin",
    "/usr",
    "/dev",
    "/proc",
    "/sys",
    "/boot"
]

# Dynamic scaling patterns for PQC security escalation.
scaling_patterns = [
    ".ssh/",
    ".env",
    "config",
    "credential",
    "password",
    "sudo",
    "rm -rf"
]

[security.roles.admin]
description = "Full access with guardrails"
allow_all = true

[security.roles.user]
description = "Standard user access"
allowed_tools = [
    "list_files_in_directory",
    "search_files",
    "read_file_content",
    "read_url_content",
    "edit_file",
    "search_web"
]
# Scopes defined in sub-sections (tomli-w handles this)
[security.roles.user.scopes.edit_file]
allowed_paths = ["~/*", "./*"]
[security.roles.user.scopes.read_file_content]
allowed_paths = ["~/*", "./*"]
[security.roles.user.scopes.search_files]
allowed_paths = ["~/*", "./*"]

[security.roles.guest]
description = "Read-only access"
allowed_tools = [
    "list_files_in_directory",
    "search_files",
    "read_file_content"
]
[security.roles.guest.scopes.read_file_content]
allowed_paths = ["./docs/*", "*.md"]
[security.roles.guest.scopes.search_files]
allowed_paths = ["./docs/*", "./llm_cli/*"]

# =============================================================================
# Gemini (Google)
# =============================================================================
[google]

[google.models]
default = "gemini-3.1-pro-preview"
lite = "gemini-3.1-flash-lite-preview"
flash = "gemini-3-flash-preview"
pro = "gemini-3.1-pro-preview"
tools = "gemini-3.1-pro-preview-customtools"
image = "gemini-3.1-flash-image-preview"
image-flash = "gemini-3.1-flash-image-preview"
image-pro = "gemini-3-pro-image-preview"
tts = "gemini-2.5-pro-preview-tts"
video = "veo-3.1-generate-preview"

# =============================================================================
# OpenAI
# =============================================================================
[openai]

[openai.models]
default = "gpt-5.4"
image = "chatgpt-image-latest"
video = "sora-2-pro"

# =============================================================================
# Anthropic (Claude)
# =============================================================================
[anthropic]
max_tokens = 8192

[anthropic.models]
default = "claude-opus-4-6"
haiku = "claude-haiku-4-5-20251001"
sonnet = "claude-sonnet-4-6"
opus = "claude-opus-4-6"

# =============================================================================
# xAI (Grok)
# =============================================================================
[xai]

[xai.models]
default = "grok-4-1-fast-reasoning"
non-reasoning = "grok-4-1-fast-non-reasoning"
reasoning = "grok-4-1-fast-reasoning"
image = "grok-imagine-image-pro"
video = "grok-imagine-video"

# =============================================================================
# Brave Search
# =============================================================================
[brave]

# =============================================================================
# Ollama (Local LLMs)
# =============================================================================
[ollama]
api_url = "http://localhost:11434/v1/chat/completions"

[ollama.models]
default = "llama3.2:3b"

# =============================================================================
# Reasoning Sentinel (Mamba-SSM Guard)
# =============================================================================
[sentinel]
enabled = true
mode = "detect"
d_model = 128
n_layers = 1
d_state = 8
d_conv = 4
expand = 1
lr = 0.001
checkpoint_path = "sentinel_state.npz"
