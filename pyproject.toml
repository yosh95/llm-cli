[project]
name = "llm-secure-cli"
version = "1.2.1"
description = "A Unified Command-Line Interface for Multiple LLMs"
authors = [
    {name = "Yoshihiro Ando", email = "yosh5295@gmail.com"}
]
license = {text = "Apache License 2.0"}
readme = "README.md"
requires-python = ">=3.11"
# Add classifiers for PyPI
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "curl_cffi>=0.15.0b2",
    "filetype",
    "markdownify",
    "prompt-toolkit",
    "pdfplumber",
    "requests",
    "rich",
    "tomli-w",
    "cbor2",
    "cryptography>=46.0.0",
    "dilithium-py",
    "kyber-py",
    "numpy",
    "psutil",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-asyncio",
    "pytest-mock",
    "pytest-cov",
    "types-requests",
    "types-setuptools",
]
dev = [
    "mypy",
    "ruff",
]

[project.scripts]
llm-cli = "llm_cli.apps.unified:main"
llm-cli-security = "llm_cli.apps.identity_tool:main"
llm-cli-models = "llm_cli.apps.model_listing:main"
llm-cli-benchmark-dual = "llm_cli.apps.benchmark:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["llm_cli*"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ["build/"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false


[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# Recommended rule sets
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "PTH", # flake8-use-pathlib
]
ignore = ["E203"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "ARG001"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
