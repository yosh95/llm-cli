[project]
name = "llm_cli"
version = "0.1.0"
description = "A Unified Command-Line Interface for Multiple LLMs"
authors = [
    {name = "Yoshihiro Ando", email = "yosh5295@gmail.com"}
]
license = {text = "Apache License 2.0"}
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "curl_cffi>=0.15.0b2",
    "filetype",
    "markdownify",
    "prompt-toolkit",
    "pypdf",
    "requests",
    "rich",
    "tomli-w",
    "PyJWT[crypto]",
    "cryptography>=46.0.0",
    "dilithium-py",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-asyncio",
    "pytest-mock",
    "pytest-cov",
    "types-requests",
    "types-setuptools",
]
dev = [
    "mypy",
    "ruff",
]
mamba = [
    "torch",
]

[project.scripts]
llm-cli-config = "llm_cli.apps.configure:main"
llm = "llm_cli.apps.unified:main"
gemini-models= "llm_cli.apps.gemini_models:main"
openai-models = "llm_cli.apps.openai_models:main"
claude-models = "llm_cli.apps.claude_models:main"
grok-models = "llm_cli.apps.grok_models:main"
ollama-models = "llm_cli.apps.ollama_models:main"
vllm-models = "llm_cli.apps.vllm_models:main"

[tool.setuptools]
packages = ["llm_cli"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ["build/"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false


[tool.pytest.ini_options]
addopts = "--cov=llm_cli --cov-report=term-missing"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
# Recommended rule sets
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "PTH", # flake8-use-pathlib
]
ignore = ["E203"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "ARG001"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
