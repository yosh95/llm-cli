[project]
name = "llm_cli"
version = "0.1.0"
description = "A Unified Command-Line Interface for Multiple LLMs"
authors = [
    {name = "Yoshihiro Ando", email = "yosh5295@gmail.com"}
]
license = {text = "Apache License 2.0"}
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4",
    "cloudscraper",
    "filetype",
    "mcp",
    "prompt-toolkit",
    "pypdf",
    "requests",
    "rich",
    "tomli-w",
    "PyJWT",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "ruff>=0.1.0"
]

[project.scripts]
llm-cli-config = "llm_cli.apps.configure:main"
llm = "llm_cli.apps.unified:main"
gemini-models= "llm_cli.apps.gemini_models:main"
openai-models = "llm_cli.apps.openai_models:main"
claude-models = "llm_cli.apps.claude_models:main"
grok-models = "llm_cli.apps.grok_models:main"
ollama-models = "llm_cli.apps.ollama_models:main"

[tool.setuptools]
packages = ["llm_cli"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E203"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
