[pytest]
minversion = 7.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# CLI options:
# -v: verbose output
# -ra: show extra test summary info for all tests except passed (e.g. skipped, failed, xfailed)
# --tb=short: shorter traceback format for failures
# --strict-markers: raise error for unregistered markers
addopts =
    -v
    -ra
    --tb=short
    --strict-markers

# Fail if a test marked as xfail actually passes
xfail_strict = true

# Warning configuration
# By default, show all warnings. Specific warnings can be ignored here if needed.
filterwarnings =
    default
    # ignore::DeprecationWarning:some_library.*

# Markers registration
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    anyio: mark tests to be executed with anyio
    asyncio: mark tests to be executed with pytest-asyncio

# Asyncio configuration
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
